[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "npcbench"
version = "0.1.0"
description = "Reproducible benchmark for language-model NPC quality, safety, and latency"
requires-python = ">=3.11"
dependencies = [
  "Jinja2==3.1.3",
  "llama-cpp-python==0.3.21",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
npcbench = "npcbench.cli:main"

[tool.setuptools]
packages = ["npcbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
